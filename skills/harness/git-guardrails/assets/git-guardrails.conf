# git-guardrails: what the agent may do with git, per profile and category.
# Values: block, ask, allow. "ask" works only on Claude Code; other agents get block.
# Edited by the human only. There is no environment variable that bypasses these rules:
# the agent could set it. To loosen a rule, change its line here.
#
# Categories:
#   destructive      reset --hard, clean -f, checkout -- ., restore ., branch -D,
#                    stash drop/clear, switch -f, rm -rf .git
#   history-rewrite  force push, push --delete, commit --amend on a pushed commit,
#                    rebase, update-ref, filter-branch, reflog expire
#   no-verify        --no-verify, commit -n, core.hooksPath, HUSKY=0
#   commit           git commit
#   push-branch      git push to any branch other than the default one
#   push-default     git push to the default branch (or to an unknown target)
#   pr-create        gh pr create
#   pr-merge         gh pr merge

interactive.destructive=block
interactive.history-rewrite=block
interactive.no-verify=ask
interactive.commit=allow
interactive.push-branch=ask
interactive.push-default=ask
interactive.pr-create=ask
interactive.pr-merge=ask

afk.destructive=block
afk.history-rewrite=block
afk.no-verify=block
afk.commit=allow
afk.push-branch=allow
afk.push-default=block
afk.pr-create=allow
afk.pr-merge=block

# Default branch. Leave unset to read it from origin/HEAD; when that is missing,
# both main and master count as default.
# default-branch=main
